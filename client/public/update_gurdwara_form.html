<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Gurdwara Information</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .success-message {
            display: none;
            background: #48bb78;
            color: white;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .required {
            color: #e53e3e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Update Gurdwara Map</h1>
        <p class="subtitle">Help us keep our Gurdwara information accurate and up-to-date</p>

        <form id="updateForm">
            <div class="form-group">
                <label for="updateType">Type of Update <span class="required">*</span></label>
                <select id="updateType" required>
                    <option value="">Select update type...</option>
                    <option value="missing">Add Missing Gurdwara</option>
                    <option value="incorrect">Correct Existing Information</option>
                    <option value="closed">Report Closed Gurdwara</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gurdwaraName">Gurdwara Name <span class="required">*</span></label>
                <input type="text" id="gurdwaraName" placeholder="e.g., Guru Nanak Sikh Temple" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Street address">
            </div>

            <div class="form-group">
                <label for="city">City <span class="required">*</span></label>
                <input type="text" id="city" placeholder="e.g., Surrey" required>
            </div>

            <div class="form-group">
                <label for="stateProvince">State/Province <span class="required">*</span></label>
                <input type="text" id="stateProvince" placeholder="e.g., BC or California" required>
            </div>

            <div class="form-group">
                <label for="country">Country <span class="required">*</span></label>
                <select id="country" required>
                    <option value="">Select country...</option>
                    <option value="USA">United States</option>
                    <option value="Canada">Canada</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Additional Details <span class="required">*</span></label>
                <textarea id="details" placeholder="Please provide details about the update, correction, or missing information..." required></textarea>
            </div>

            <div class="form-group">
                <label for="email">Your Email (optional)</label>
                <input type="email" id="email" placeholder="your.email@example.com">
            </div>

            <div class="button-group">
                <button type="button" class="btn-secondary" onclick="resetForm()">Clear</button>
                <button type="submit" class="btn-primary">Submit Update</button>
            </div>
        </form>

        <div class="success-message" id="successMessage">
            ✓ Thank you! Your update has been submitted successfully.
        </div>
    </div>

    <script>
        const form = document.getElementById('updateForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                updateType: document.getElementById('updateType').value,
                gurdwaraName: document.getElementById('gurdwaraName').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                stateProvince: document.getElementById('stateProvince').value,
                country: document.getElementById('country').value,
                details: document.getElementById('details').value,
                email: document.getElementById('email').value,
                timestamp: new Date().toISOString()
            };

            // TODO: Replace with your actual API endpoint
            // Example: await fetch('/api/gurdwara-updates', { method: 'POST', body: JSON.stringify(formData) })
            
            console.log('Form submission:', formData);

            // For now, save to localStorage as a demo
            const updates = JSON.parse(localStorage.getItem('gurdwaraUpdates') || '[]');
            updates.push(formData);
            localStorage.setItem('gurdwaraUpdates', JSON.stringify(updates));

            // Show success message
            successMessage.classList.add('show');
            form.reset();

            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
        });

        function resetForm() {
            form.reset();
            successMessage.classList.remove('show');
        }
    </script>
</body>
</html>
